    <!-- 連携相談フォーム -->

        </div>
        <form id="partner-form" class="form-card" novalidate>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="p_org" data-i18n="pages.partners.f_org">機関・会社名</label><input type="text" id="p_org" name="orgName" required><div class="err-msg" data-i18n="errors.required"></div></div>
            <div class="field"><label for="p_country" data-i18n="pages.partners.f_country">国・地域</label><input type="text" id="p_country" name="country"></div>
          </div>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="p_person" data-i18n="pages.partners.f_person">ご担当者名</label><input type="text" id="p_person" name="contactPerson"></div>
            <div class="field"><label for="p_type" data-i18n="pages.partners.f_type">種別</label><select id="p_type" name="partnerType"></select></div>
          </div>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="p_email" data-i18n="pages.partners.f_email">メールアドレス</label><input type="email" id="p_email" name="email" required><div class="err-msg" data-i18n="errors.email"></div></div>
            <div class="field"><label for="p_phone" data-i18n="pages.partners.f_phone">電話 / WhatsApp</label><input type="tel" id="p_phone" name="phone"></div>
          </div>
          <div class="field"><label for="p_message" data-i18n="pages.partners.f_message">ご相談内容</label><textarea id="p_message" name="message"></textarea></div>

          <div id="partner-status" class="notice" hidden style="margin-bottom:14px"></div>
          <button type="submit" class="btn btn--primary btn--lg btn--block" id="p_submit" data-i18n="pages.partners.submit">送信する</button>

  <script>
    (function () {
      function L(o, lang) { return OUKA.pick(o, lang); }
      function typeLabel(type) {
        if (type === "sending") return OUKA.t("pages.partners.sendingOrg");
        if (type === "company") return OUKA.t("pages.partners.company");
        return OUKA.t("pages.partners.partner");
      }
      function renderList() {
        var partners = window.OUKA_PARTNERS || [];
        var lang = OUKA.getLang();
        var grid = document.getElementById("partner-grid");
        var empty = document.getElementById("partner-empty");
        grid.innerHTML = "";
        if (!partners.length) { grid.style.display = "none"; empty.hidden = false; return; }
        grid.style.display = ""; empty.hidden = true;
        partners.forEach(function (p) {
          var card = document.createElement("div"); card.className = "partner-card";
          if (p.logo) { var img = document.createElement("img"); img.className = "plogo"; img.src = "assets/images/" + p.logo; img.alt = p.name || ""; card.appendChild(img); }
          else { var lg = document.createElement("div"); lg.className = "plogo"; lg.textContent = (p.name || "?").charAt(0).toUpperCase(); card.appendChild(lg); }
          var pn = document.createElement("div"); pn.className = "pn"; pn.textContent = p.name || "—"; card.appendChild(pn);
          if (p.country) { var pc = document.createElement("div"); pc.className = "pc"; pc.textContent = L(p.country, lang); card.appendChild(pc); }
          var pt = document.createElement("span"); pt.className = "pt"; pt.textContent = typeLabel(p.type); card.appendChild(pt);
          if (p.note && L(p.note, lang)) { var pnote = document.createElement("div"); pnote.className = "pnote"; pnote.textContent = L(p.note, lang); card.appendChild(pnote); }
          grid.appendChild(card);
        });
      }
      function fillType() {
        var sel = document.getElementById("p_type"); var cur = sel.value; sel.innerHTML = "";
        [["", OUKA.t("common.selectPlaceholder")],
         ["sending", OUKA.t("pages.partners.sendingOrg")],
         ["company", OUKA.t("pages.partners.company")],
         ["partner", OUKA.t("pages.partners.partner")]].forEach(function (o) {
          var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; if (cur === o[0]) op.selected = true; sel.appendChild(op);
        });
      }
      function showStatus(kind, html) { var box = document.getElementById("partner-status"); box.hidden = false; box.className = "notice " + (kind === "warn" ? "notice--warn" : ""); box.innerHTML = html; }
      function contactFallback() {
        var s = OUKA.cfg.school || {}; var p = [];
        if (s.phone) p.push('<a href="tel:' + OUKA.escapeHtml(s.phone) + '">' + OUKA.t("common.phone") + "：" + OUKA.escapeHtml(s.phone) + "</a>");
        if (s.email) p.push('<a href="mailto:' + OUKA.escapeHtml(s.email) + '">' + OUKA.t("common.email") + "</a>");
        return p.length ? ("<div style='margin-top:8px'>" + p.join(" ／ ") + "</div>") : "";
      }
      function build() {
        var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
        return {
          formType: "PARTNER_INQUIRY", applicationDate: OUKA.dateStamp(), status: "NEW_PARTNER",
          applicationSource: (OUKA.cfg.behavior && OUKA.cfg.behavior.applicationSource) || "OUKA_WEBSITE",
          orgName: g("p_org"), country: g("p_country"), contactPerson: g("p_person"),
          partnerType: g("p_type"), email: g("p_email"), phone: g("p_phone"), message: g("p_message")
        };
      }
      function validate() {
        var ok = true;
        function fe(id, cond) { var el = document.getElementById(id), f = el ? el.closest(".field") : null; if (!f) return; if (cond) { f.classList.add("has-error"); ok = false; } else f.classList.remove("has-error"); }
        fe("p_org", !document.getElementById("p_org").value.trim());
        var em = document.getElementById("p_email").value.trim();
        fe("p_email", !em || !OUKA.isEmail(em));
        return ok;
      }
      function pending() { showStatus("warn", OUKA.escapeHtml(OUKA.t("common.preparingNotice")) + contactFallback()); }
      function onSubmit(e) {
        e.preventDefault();
        if (!validate()) { showStatus("warn", OUKA.getLang() === "en" ? "Please check the required fields." : "必須項目をご確認ください。"); return; }
        var data = build(); var btn = document.getElementById("p_submit");
        if (OUKA_FORM.hasAppsScript()) {
          btn.disabled = true; showStatus("", OUKA.t("common.loading"));
          OUKA_FORM.submit(data).then(function (res) {
            if (res.status === "SENT") { document.getElementById("partner-form").hidden = true; document.getElementById("partner-thanks").hidden = false; window.scrollTo({ top: 0, behavior: "smooth" }); }
            else { pending(); btn.disabled = false; }
          }).catch(function () { btn.disabled = false; pending(); });
        } else { pending(); }
      }
      function boot() { renderList(); fillType(); document.getElementById("partner-form").addEventListener("submit", onSubmit); document.addEventListener("ouka:langchange", function () { renderList(); fillType(); }); }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
    })();
  </script>
