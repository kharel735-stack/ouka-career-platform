  <main id="main">
    <div class="result-hero" style="padding:clamp(28px,6vw,52px) 0">
      <div class="container">
        <h1 style="color:#fff" data-i18n="company.title">日本企業の採用ご担当者さまへ</h1>
        <p class="meta" style="max-width:720px" data-i18n="company.lead"></p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="grid grid-2">
          <div class="card">
            <h3 data-i18n="company.policyHeading">人材育成の方針</h3>
            <p data-i18n="company.policyBody"></p>
          </div>
          <div class="card">
            <h3 data-i18n="company.evalHeading">学生の評価項目</h3>
            <div class="jobs-grid" style="justify-content:flex-start" id="eval-items"></div>
          </div>
        </div>

        <div class="section-head" style="margin-top:48px">
          <span class="eyebrow">Occupations</span>
          <h2 data-i18n="jobs.heading">対応職種</h2>
        </div>
        <div class="jobs-grid" id="job-chips"></div>
      </div>
    </section>

    <section class="section section--beige">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="company.formHeading">採用・提携のご相談</h2>
          <p data-i18n="company.formLead"></p>
        </div>

        <form id="company-form" class="form-card" novalidate>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="c_company" data-i18n="company.f_company">会社名</label><input type="text" id="c_company" name="companyName" required><div class="err-msg" data-i18n="errors.required"></div></div>
            <div class="field"><label for="c_person" data-i18n="company.f_person">ご担当者名</label><input type="text" id="c_person" name="contactPerson" required><div class="err-msg" data-i18n="errors.required"></div></div>
          </div>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="c_email" data-i18n="company.f_email">メールアドレス</label><input type="email" id="c_email" name="email" required><div class="err-msg" data-i18n="errors.email"></div></div>
            <div class="field"><label for="c_phone" data-i18n="company.f_phone">電話番号</label><input type="tel" id="c_phone" name="phone"></div>
          </div>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="c_headcount" data-i18n="company.f_headcount">採用予定人数</label><input type="text" id="c_headcount" name="headcount"></div>
            <div class="field"><label for="c_timing" data-i18n="company.f_timing">採用時期</label><input type="text" id="c_timing" name="timing"></div>
          </div>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="c_jobtype" data-i18n="company.f_jobtype">職種</label><input type="text" id="c_jobtype" name="jobType"></div>
            <div class="field"><label for="c_location" data-i18n="company.f_location">勤務地</label><input type="text" id="c_location" name="location"></div>
          </div>
          <div class="field"><label for="c_jobdesc" data-i18n="company.f_jobdesc">仕事内容</label><textarea id="c_jobdesc" name="jobDescription"></textarea></div>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="c_jplevel" data-i18n="company.f_jplevel">必要な日本語レベル</label><input type="text" id="c_jplevel" name="requiredJapanese"></div>
            <div class="field"><label for="c_skills" data-i18n="company.f_skills">必要な技能</label><input type="text" id="c_skills" name="requiredSkills"></div>
          </div>
          <div class="field">
            <label data-i18n="company.f_dorm">寮の有無</label>
            <div class="opt-btn-group cols-2" id="c_dorm"></div>
          </div>
          <div class="field">
            <label class="consent-row"><input type="checkbox" id="c_interview" name="wantInterview"><span data-i18n="company.f_interview">面接を希望する</span></label>
          </div>
          <div class="field">
            <label class="consent-row"><input type="checkbox" id="c_partnership" name="wantPartnership"><span data-i18n="company.f_partnership">業務提携の相談を希望する</span></label>
          </div>
          <div class="field"><label for="c_message" data-i18n="company.f_message">その他ご要望</label><textarea id="c_message" name="message"></textarea></div>

          <div id="company-status" class="notice" hidden style="margin-bottom:14px"></div>
          <button type="submit" class="btn btn--primary btn--lg btn--block" id="c_submit" data-i18n="company.submit">送信する</button>
        </form>

        <div id="company-thanks" class="form-card" hidden style="text-align:center;margin-top:16px">
          <h2 data-i18n="application.thanksTitle">お申し込みを受け付けました</h2>
          <p data-i18n="application.thanksBody"></p>
        </div>
      </div>
    </section>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/assessment-scoring.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/form-connector.js"></script>
  <script>
    (function () {
      /* 評価項目チップ */
      function renderEval() {
        var wrap = document.getElementById("eval-items");
        var items = OUKA.t("company.evalItems");
        if (!Array.isArray(items)) return;
        wrap.innerHTML = "";
        items.forEach(function (x) {
          var chip = document.createElement("span");
          chip.className = "job-chip"; chip.textContent = x;
          wrap.appendChild(chip);
        });
      }
      /* 対応職種チップ */
      function renderJobs() {
        var wrap = document.getElementById("job-chips");
        if (!wrap || !window.OUKA_SCORING) return;
        var lang = OUKA.getLang();
        wrap.innerHTML = "";
        OUKA_SCORING.visibleCodes(OUKA.cfg).forEach(function (code) {
          var st = OUKA.jobStatus(code);
          var badge = st === "active" ? "badge--active" : (st === "consulting" ? "badge--consulting" : "badge--preparing");
          var chip = document.createElement("span"); chip.className = "job-chip";
          var nm = document.createElement("span"); nm.textContent = OUKA.jobName(code, lang);
          var bd = document.createElement("span"); bd.className = "badge " + badge; bd.textContent = OUKA.jobStatusLabel(code, lang);
          chip.appendChild(nm); chip.appendChild(bd); wrap.appendChild(chip);
        });
      }
      /* 寮ラジオ */
      function renderDorm() {
        var c = document.getElementById("c_dorm");
        c.innerHTML = "";
        [{v:"YES",t:OUKA.t("common.yes")},{v:"NO",t:OUKA.t("common.no")}].forEach(function(o){
          var id="dorm_"+o.v;
          var label=document.createElement("label"); label.className="opt-btn"; label.setAttribute("for",id);
          var input=document.createElement("input"); input.type="radio"; input.name="dorm"; input.id=id; input.value=o.v;
          label.appendChild(input);
          var dot=document.createElement("span"); dot.className="dot"; label.appendChild(dot);
          var s=document.createElement("span"); s.textContent=o.t; label.appendChild(s);
          c.appendChild(label);
        });
      }
      function radioVal(name){ var el=document.querySelector('input[name="'+name+'"]:checked'); return el?el.value:""; }

      function showStatus(kind, html){
        var box=document.getElementById("company-status");
        box.hidden=false; box.className="notice "+(kind==="warn"?"notice--warn":""); box.innerHTML=html;
      }
      function contactFallback(){
        var s=OUKA.cfg.school||{}; var p=[];
        if(s.phone) p.push('<a href="tel:'+OUKA.escapeHtml(s.phone)+'">'+OUKA.t("common.phone")+"："+OUKA.escapeHtml(s.phone)+"</a>");
        if(s.email) p.push('<a href="mailto:'+OUKA.escapeHtml(s.email)+'">'+OUKA.t("common.email")+"："+OUKA.escapeHtml(s.email)+"</a>");
        return p.length?("<div style='margin-top:8px'>"+p.join(" ／ ")+"</div>"):"";
      }

      function build(){
        var g=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
        return {
          formType:"COMPANY_INQUIRY", applicationDate:OUKA.dateStamp(), status:"NEW_INQUIRY",
          applicationSource:(OUKA.cfg.behavior&&OUKA.cfg.behavior.applicationSource)||"OUKA_WEBSITE",
          companyName:g("c_company"), contactPerson:g("c_person"), email:g("c_email"), phone:g("c_phone"),
          headcount:g("c_headcount"), timing:g("c_timing"), jobType:g("c_jobtype"), location:g("c_location"),
          jobDescription:g("c_jobdesc"), requiredJapanese:g("c_jplevel"), requiredSkills:g("c_skills"),
          dorm:radioVal("dorm"),
          wantInterview:document.getElementById("c_interview").checked?"YES":"NO",
          wantPartnership:document.getElementById("c_partnership").checked?"YES":"NO",
          message:g("c_message")
        };
      }
      function validate(){
        var ok=true;
        function fe(id,cond){var el=document.getElementById(id),f=el?el.closest(".field"):null;if(!f)return;if(cond){f.classList.add("has-error");ok=false;}else f.classList.remove("has-error");}
        fe("c_company",!document.getElementById("c_company").value.trim());
        fe("c_person",!document.getElementById("c_person").value.trim());
        var em=document.getElementById("c_email").value.trim();
        fe("c_email",!em||!OUKA.isEmail(em));
        return ok;
      }
      function pending(data){
        var link = OUKA_FORM.hasGoogleForm("company") ? OUKA_FORM.formUrl("company") : "";
        if(link){ showStatus("", (OUKA.getLang()==="en"?"Please continue on the official form: ":"公式フォームで続けてください：")+'<a class="btn btn--primary" style="margin-left:8px" target="_blank" rel="noopener" href="'+OUKA.escapeHtml(link)+'">'+(OUKA.getLang()==="en"?"Open form":"フォームを開く")+"</a>"); }
        else { showStatus("warn", OUKA.escapeHtml(OUKA.t("common.preparingNotice"))+contactFallback()); }
      }
      function onSubmit(e){
        e.preventDefault();
        if(!validate()){ showStatus("warn", OUKA.getLang()==="en"?"Please check the required fields.":"必須項目をご確認ください。"); return; }
        var data=build(); var btn=document.getElementById("c_submit");
        if(OUKA_FORM.hasAppsScript()){
          btn.disabled=true; showStatus("", OUKA.t("common.loading"));
          OUKA_FORM.submit(data).then(function(res){
            if(res.status==="SENT"){ document.getElementById("company-form").hidden=true; document.getElementById("company-thanks").hidden=false; window.scrollTo({top:0,behavior:"smooth"}); }
            else { pending(data); btn.disabled=false; }
          }).catch(function(){ btn.disabled=false; pending(data); });
        } else { pending(data); }
      }

      function boot(){ renderEval(); renderJobs(); renderDorm(); document.getElementById("company-form").addEventListener("submit", onSubmit); document.addEventListener("ouka:langchange", function(){renderEval();renderJobs();renderDorm();}); }
      if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
    })();
  </script>
