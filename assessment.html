  <main id="main">
    <!-- 進捗バー -->
    <div class="progress" id="progress" hidden>
      <div class="container assess-wrap" style="padding-top:0;padding-bottom:0">
        <div class="progress__meta">
          <span id="progress-step-name">—</span>
          <span><b id="progress-cur">1</b> <span data-i18n="assessment.stepOf">／</span> <span id="progress-total">7</span></span>
        </div>
        <div class="progress__bar"><div class="progress__fill" id="progress-fill"></div></div>
        <div class="progress__dots" id="progress-dots"></div>
      </div>
    </div>

    <div class="container">
      <div class="assess-wrap">

        <!-- イントロ（初回表示） -->
        <div id="intro">
          <div class="section-head" style="text-align:left;margin-bottom:16px">
            <h1 data-i18n="assessment.title">無料適性診断</h1>
            <p data-i18n="assessment.intro"></p>
          </div>
          <div class="notice" data-i18n="disclaimer.storage" style="margin-bottom:16px"></div>
          <div id="resume-box" class="notice notice--warn" hidden style="margin-bottom:16px">
            <p style="margin:0 0 10px" data-i18n="assessment.resumeNotice"></p>
            <button type="button" class="btn btn--outline" id="btn-clear-intro" data-i18n="assessment.clearSaved">一時保存を削除して最初から</button>
          </div>
          <button type="button" class="btn btn--primary btn--lg btn--block" id="btn-start" data-i18n="assessIntro.cta">無料適性診断を始める</button>
        </div>

        <!-- フォーム本体 -->
        <form id="assess-form" novalidate hidden>
          <div class="assess-toolbar">
            <button type="button" id="btn-restart" data-i18n="assessment.clearSaved">一時保存を削除して最初から</button>
          </div>
          <div class="step-head">
            <h2 id="step-title">—</h2>
            <p class="step-sub" id="step-sub"></p>
          </div>

          <div id="step-container"><!-- 質問をJSで描画 --></div>

          <div class="autosave-flag" id="autosave-flag" data-i18n="assessment.autosaved">自動保存しました</div>

          <div class="assess-nav">
            <button type="button" class="btn btn--outline btn--back" id="btn-back" data-i18n="common.back">戻る</button>
            <button type="button" class="btn btn--primary" id="btn-next" data-i18n="common.next">次へ</button>
          </div>
        </form>

      </div>
    </div>
