  <script>
    (function () {
      function render() {
        var students = window.OUKA_STUDENTS || [];
        var lang = OUKA.getLang();
        var listed = students.length;
        var override = (OUKA.cfg.content && OUKA.cfg.content.enrollmentTotal);
        var total = (typeof override === "number" && override >= 0) ? override : listed;

        // 在籍者数の見出し
        var ch = document.getElementById("count-hero");
        ch.innerHTML = "";
        function box(n, label) {
          var b = document.createElement("div"); b.className = "count-box";
          var nn = document.createElement("div"); nn.className = "n"; nn.textContent = n + (OUKA.t("pages.students.unit") || "");
          var ll = document.createElement("div"); ll.className = "l"; ll.textContent = label;
          b.appendChild(nn); b.appendChild(ll); return b;
        }
        ch.appendChild(box(total, OUKA.t("pages.students.enrolled")));
        if (listed && listed !== total) ch.appendChild(box(listed, OUKA.t("pages.students.showing")));

        // 一覧
        var grid = document.getElementById("student-grid");
        var empty = document.getElementById("student-empty");
        grid.innerHTML = "";
        var showRoster = !(OUKA.cfg.content && OUKA.cfg.content.showStudentRoster === false);
        if (!listed || !showRoster) { grid.style.display = "none"; empty.hidden = false; return; }
        grid.style.display = ""; empty.hidden = true;

        students.forEach(function (s) {
          var card = document.createElement("div"); card.className = "student-card";
          var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = s.displayName || "—"; card.appendChild(nm);
          if (s.level) { var lv = document.createElement("span"); lv.className = "lv"; lv.textContent = OUKA.t("pages.students.level") + " " + s.level; card.appendChild(lv); }
          if (s.qualifications && s.qualifications.length) {
            var ul = document.createElement("ul"); ul.className = "quals";
            s.qualifications.forEach(function (q) { var li = document.createElement("li"); li.textContent = q; ul.appendChild(li); });
            card.appendChild(ul);
          }
          var metaParts = [];
          if (s.course) metaParts.push(OUKA.t("pages.students.course") + ": " + OUKA.jobName(s.course, lang));
          if (s.since) metaParts.push(OUKA.t("pages.students.since") + ": " + s.since);
          if (metaParts.length) { var m = document.createElement("div"); m.className = "meta"; m.textContent = metaParts.join(" ・ "); card.appendChild(m); }
          grid.appendChild(card);
        });
      }
      render();
      document.addEventListener("ouka:langchange", render);
    })();
  </script>
