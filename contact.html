<body>

      <a class="brand" href="index.html" aria-label="OUKA Skill Training Center - Work to Japan">

  <main id="main">
    <div class="result-hero" style="padding:clamp(24px,5vw,44px) 0">
      <div class="container">
        <h1 style="color:#fff" data-i18n="contact.title">お問い合わせ</h1>
        <p class="meta" style="max-width:640px" data-i18n="contact.lead"></p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <!-- 連絡先カード -->
        <div class="contact-cards" style="max-width:760px;margin:0 auto 28px">
          <div class="contact-card" data-contact-item><b data-i18n="common.phone">電話</b><a data-tel data-show="phone" href="#">-</a></div>
          <div class="contact-card" data-contact-item><b>固定 / Landline</b><a data-landline data-show="landline" href="#">-</a></div>
          <div class="contact-card" data-contact-item><b data-i18n="common.whatsapp">WhatsApp</b><a data-whatsapp data-show="whatsapp" href="#" target="_blank" rel="noopener">-</a></div>
          <div class="contact-card" data-contact-item><b data-i18n="common.email">メール</b><a data-email data-show="email" href="#">-</a></div>
          <div class="contact-card" data-contact-item><b data-i18n="common.address">住所</b><span data-show="address-ja"></span></div>
        </div>

        <form id="contact-form" class="form-card" novalidate>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="ct_name" data-i18n="contact.f_name">お名前</label><input type="text" id="ct_name" name="name" required><div class="err-msg" data-i18n="errors.required"></div></div>
            <div class="field"><label for="ct_email" data-i18n="contact.f_email">メールアドレス</label><input type="email" id="ct_email" name="email"><div class="err-msg" data-i18n="errors.email"></div></div>
          </div>
          <div class="grid grid-2" style="gap:14px">
            <div class="field"><label for="ct_phone" data-i18n="contact.f_phone">電話番号</label><input type="tel" id="ct_phone" name="phone"></div>
            <div class="field"><label for="ct_type" data-i18n="contact.f_type">お問い合わせ種別</label><select id="ct_type" name="inquiryType"></select></div>
          </div>
          <div class="field"><label for="ct_message" data-i18n="contact.f_message">お問い合わせ内容</label><textarea id="ct_message" name="message" required></textarea><div class="err-msg" data-i18n="errors.required"></div></div>

          <div id="contact-status" class="notice" hidden style="margin-bottom:14px"></div>
          <button type="submit" class="btn btn--primary btn--lg btn--block" id="ct_submit" data-i18n="contact.submit">送信する</button>
        </form>

        <div id="contact-thanks" class="form-card" hidden style="text-align:center;max-width:760px;margin:16px auto 0">
          <h2 data-i18n="application.thanksTitle">お申し込みを受け付けました</h2>
          <p data-i18n="application.thanksBody"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p class="fine"><span data-i18n="footer.copyright"></span></p></div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/form-connector.js"></script>
  <script>
    (function () {
      function fillType() {
        var sel = document.getElementById("ct_type");
        var cur = sel.value;
        sel.innerHTML = "";
        [["", OUKA.t("common.selectPlaceholder")],
         ["STUDENT", OUKA.t("contact.type_student")],
         ["COMPANY", OUKA.t("contact.type_company")],
         ["OTHER", OUKA.t("contact.type_other")]].forEach(function (o) {
          var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1];
          if (cur === o[0]) op.selected = true; sel.appendChild(op);
        });
      }
      function showStatus(kind, html) {
        var box = document.getElementById("contact-status");
        box.hidden = false; box.className = "notice " + (kind === "warn" ? "notice--warn" : ""); box.innerHTML = html;
      }
      function contactFallback() {
        var s = OUKA.cfg.school || {}; var p = [];
        if (s.phone) p.push('<a href="tel:' + OUKA.escapeHtml(s.phone) + '">' + OUKA.t("common.phone") + "：" + OUKA.escapeHtml(s.phone) + "</a>");
        if (s.whatsapp) p.push('<a href="https://wa.me/' + OUKA.escapeHtml(s.whatsapp.replace(/[^0-9]/g,"")) + '" target="_blank" rel="noopener">WhatsApp</a>');
        if (s.email) p.push('<a href="mailto:' + OUKA.escapeHtml(s.email) + '">' + OUKA.t("common.email") + "</a>");
        return p.length ? ("<div style='margin-top:8px'>" + p.join(" ／ ") + "</div>") : "";
      }
      function build() {
        var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
        return {
          formType: "CONTACT", applicationDate: OUKA.dateStamp(), status: "NEW_CONTACT",
          applicationSource: (OUKA.cfg.behavior && OUKA.cfg.behavior.applicationSource) || "OUKA_WEBSITE",
          name: g("ct_name"), email: g("ct_email"), phone: g("ct_phone"),
          inquiryType: g("ct_type"), message: g("ct_message")
        };
      }
      function validate() {
        var ok = true;
        function fe(id, cond) { var el = document.getElementById(id), f = el ? el.closest(".field") : null; if (!f) return; if (cond) { f.classList.add("has-error"); ok = false; } else f.classList.remove("has-error"); }
        fe("ct_name", !document.getElementById("ct_name").value.trim());
        fe("ct_message", !document.getElementById("ct_message").value.trim());
        var em = document.getElementById("ct_email").value.trim();
        fe("ct_email", em && !OUKA.isEmail(em));
        return ok;
      }
      function pending() {
        showStatus("warn", OUKA.escapeHtml(OUKA.t("common.preparingNotice")) + contactFallback());
      }
      function onSubmit(e) {
        e.preventDefault();
        if (!validate()) { showStatus("warn", OUKA.getLang() === "en" ? "Please check the required fields." : "必須項目をご確認ください。"); return; }
        var data = build(); var btn = document.getElementById("ct_submit");
        if (OUKA_FORM.hasAppsScript()) {
          btn.disabled = true; showStatus("", OUKA.t("common.loading"));
          OUKA_FORM.submit(data).then(function (res) {
            if (res.status === "SENT") { document.getElementById("contact-form").hidden = true; document.getElementById("contact-thanks").hidden = false; window.scrollTo({ top: 0, behavior: "smooth" }); }
            else { pending(); btn.disabled = false; }
          }).catch(function () { btn.disabled = false; pending(); });
        } else { pending(); }
      }
      function boot() { fillType(); document.getElementById("contact-form").addEventListener("submit", onSubmit); document.addEventListener("ouka:langchange", fillType); }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
    })();
  </script>
</body>
</html>
