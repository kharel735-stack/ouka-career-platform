  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      function render() {
        var embedUrl = (OUKA.cfg.content && OUKA.cfg.content.galleryEmbedUrl) || "";
        var photos = window.OUKA_GALLERY || [];
        var grid = document.getElementById("gallery-grid");
        var embed = document.getElementById("gallery-embed");
        var empty = document.getElementById("gallery-empty");
        grid.innerHTML = ""; embed.innerHTML = "";
        embed.hidden = true; empty.hidden = true;

        if (embedUrl && /^https?:\/\//.test(embedUrl)) {
          var iframe = document.createElement("iframe");
          iframe.src = embedUrl; iframe.loading = "lazy"; iframe.title = "Gallery";
          embed.appendChild(iframe); embed.hidden = false;
          return;
        }
        if (!photos.length) { empty.hidden = false; return; }

        var lang = OUKA.getLang();
        photos.forEach(function (p) {
          var fig = document.createElement("figure"); fig.className = "gphoto";
          if (p.category) {
            var cat = document.createElement("span"); cat.className = "cat";
            cat.textContent = OUKA.jobName(p.category, lang); fig.appendChild(cat);
          }
          var img = document.createElement("img");
          img.src = "assets/images/gallery/" + p.src; img.loading = "lazy";
          img.alt = OUKA.pick(p.caption, lang);
          fig.appendChild(img);
          var cap = OUKA.pick(p.caption, lang);
          if (cap) { var fc = document.createElement("figcaption"); fc.textContent = cap; fig.appendChild(fc); }
          grid.appendChild(fig);
        });
      }
      render();
      document.addEventListener("ouka:langchange", render);
    })();
  </script>
