  <script>
    (function () {
      var current = "ALL";
      function L(o) { return OUKA.pick(o, OUKA.getLang()); }

      function renderCats() {
        var wrap = document.getElementById("faq-cats");
        wrap.innerHTML = "";
        var cats = window.OUKA_FAQ_CATS || {};
        function btn(key, label) {
          var b = document.createElement("button");
          b.className = "faq-cat"; b.type = "button"; b.setAttribute("data-cat", key);
          b.setAttribute("aria-pressed", current === key ? "true" : "false");
          b.textContent = label;
          b.addEventListener("click", function () { current = key; renderCats(); renderList(); });
          return b;
        }
        wrap.appendChild(btn("ALL", OUKA.t("pages.faq.allCat")));
        Object.keys(cats).forEach(function (k) { wrap.appendChild(btn(k, L(cats[k]))); });
      }

      function renderList() {
        var list = document.getElementById("faq-list");
        var faqs = window.OUKA_FAQ || [];
        var cats = window.OUKA_FAQ_CATS || {};
        list.innerHTML = "";
        var shown = faqs.filter(function (f) { return current === "ALL" || f.cat === current; });

        if (current === "ALL") {
          // カテゴリ見出しつきで表示
          Object.keys(cats).forEach(function (ck) {
            var items = faqs.filter(function (f) { return f.cat === ck; });
            if (!items.length) return;
            var h = document.createElement("div"); h.className = "faq-cat-head"; h.textContent = L(cats[ck]); list.appendChild(h);
            items.forEach(function (f) { list.appendChild(item(f)); });
          });
        } else {
          shown.forEach(function (f) { list.appendChild(item(f)); });
        }
      }

      function item(f) {
        var d = document.createElement("details");
        var s = document.createElement("summary"); s.textContent = L(f.q); d.appendChild(s);
        var p = document.createElement("p"); p.textContent = L(f.a); d.appendChild(p);
        return d;
      }

      function render() { renderCats(); renderList(); }
      render();
      document.addEventListener("ouka:langchange", render);
    })();
  </script>
