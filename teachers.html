  <script>
    (function () {
      function L(o, lang) { return OUKA.pick(o, lang); }
      function isUrl(s) { return /^https?:\/\//.test(s); }
      function initials(name) { return (name || "?").trim().charAt(0).toUpperCase(); }

      function videoEl(video) {
        var wrap = document.createElement("div"); wrap.className = "video-frame";
        if (isUrl(video)) {
          var iframe = document.createElement("iframe");
          iframe.src = video; iframe.loading = "lazy"; iframe.allowFullscreen = true;
          iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture");
          iframe.title = "Interview";
          wrap.appendChild(iframe);
        } else {
          var v = document.createElement("video");
          v.src = "assets/images/teachers/" + video; v.controls = true; v.preload = "metadata";
          wrap.appendChild(v);
        }
        return wrap;
      }

      function render() {
        var teachers = window.OUKA_TEACHERS || [];
        var lang = OUKA.getLang();
        var list = document.getElementById("teacher-list");
        var empty = document.getElementById("teacher-empty");
        list.innerHTML = "";
        if (!teachers.length) { empty.hidden = false; return; }
        empty.hidden = true;

        teachers.forEach(function (t) {
          var card = document.createElement("div"); card.className = "teacher";

          var head = document.createElement("div"); head.className = "teacher__head";
          if (t.photo) {
            var img = document.createElement("img"); img.className = "teacher__avatar";
            img.src = "assets/images/teachers/" + t.photo; img.alt = t.name || ""; head.appendChild(img);
          } else {
            var av = document.createElement("div"); av.className = "teacher__avatar"; av.textContent = initials(t.name); head.appendChild(av);
          }
          var info = document.createElement("div");
          var nm = document.createElement("p"); nm.className = "teacher__name"; nm.textContent = t.name || "—"; info.appendChild(nm);
          if (t.role) { var rl = document.createElement("div"); rl.className = "teacher__role"; rl.textContent = L(t.role, lang); info.appendChild(rl); }
          head.appendChild(info);
          card.appendChild(head);

          var body = document.createElement("div"); body.className = "teacher__body";
          if (t.video) {
            body.appendChild(videoEl(t.video));
          }
          function kv(labelKey, val) {
            if (!val) return;
            var box = document.createElement("div"); box.className = "teacher__kv";
            var h = document.createElement("h4"); h.textContent = OUKA.t(labelKey); box.appendChild(h);
            var p = document.createElement("p"); p.textContent = val; box.appendChild(p);
            body.appendChild(box);
          }
          kv("pages.teachers.study", L(t.study, lang));
          kv("pages.teachers.career", L(t.career, lang));
          card.appendChild(body);
          list.appendChild(card);
        });
      }
      render();
      document.addEventListener("ouka:langchange", render);
    })();
  </script>
