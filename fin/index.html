<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABAS 財務</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#12294B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ABAS財務">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="fin.css?v=47cb5b29ec">
</head>
<body>
<!-- ログイン（本番 /app/・/iv/ と同じ Clerk のアカウント。パスワードはどこにも保存しない） -->
<section class="login" id="loginView">
  <div class="login-card">
    <h1>ABAS <span>財務</span></h1>
    <p class="muted">お金に関わる人だけが使えます</p>
    <form id="loginForm" autocomplete="on">
      <label>ユーザー名<input id="fUsername" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>パスワード<input id="fPassword" name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary big" id="loginBtn" type="submit">ログイン</button>
    </form>
    <form id="codeForm" hidden>
      <p id="codeHint"></p>
      <label>確認コード（6桁）<input id="fCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
      <button class="btn primary big" type="submit">確認</button>
      <button class="btn" id="codeCancel" type="button">やめる</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </div>
</section>

<div id="appShell" hidden>
  <header class="top">
    <a class="brand" href="#/">ABAS <span>財務</span></a>
    <span class="who" id="who"></span>
    <button class="btn small" id="logoutBtn" type="button">ログアウト</button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" hidden></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<noscript>JavaScriptを有効にしてください。</noscript>
<!-- 数字はここに1つも無い。ログインしてから受け口（FinLayer）から受け取る -->
<script src="config.js?v=47cb5b29ec"></script>
<script src="auth.js?v=47cb5b29ec"></script>
<script src="voice.js?v=47cb5b29ec"></script>
<script src="photo.js?v=47cb5b29ec"></script>
<script src="fin.js?v=47cb5b29ec"></script>
</body>
</html>
