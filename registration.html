  <script>
    (function () {
      function statusLabel(st) {
        if (st === "registered") return OUKA.t("pages.reg.sRegistered");
        if (st === "applying") return OUKA.t("pages.reg.sApplying");
        return OUKA.t("pages.reg.sPreparing");
      }
      function render() {
        var items = window.OUKA_REGISTRATION || [];
        var lang = OUKA.getLang();
        var list = document.getElementById("reg-list");
        list.innerHTML = "";
        items.forEach(function (it) {
          var row = document.createElement("div"); row.className = "reg-item";
          var left = document.createElement("div");
          var lbl = document.createElement("div"); lbl.className = "lbl";
          lbl.textContent = OUKA.pick(it.label, lang); left.appendChild(lbl);
          var val = document.createElement("div"); val.className = "val";
          val.textContent = OUKA.pick(it.value, lang); left.appendChild(val);
          if (it.docImage) {
            var a = document.createElement("a"); a.className = "doc";
            a.href = "assets/images/" + it.docImage; a.target = "_blank"; a.rel = "noopener";
            a.textContent = OUKA.t("pages.reg.viewDoc"); left.appendChild(a);
          }
          row.appendChild(left);
          var st = document.createElement("span"); st.className = "st " + (it.status || "preparing");
          st.textContent = statusLabel(it.status); row.appendChild(st);
          list.appendChild(row);
        });
      }
      render();
      document.addEventListener("ouka:langchange", render);
    })();
  </script>
