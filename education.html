  <script>
    (function () {
      function fillPoints(id, key) {
        var ul = document.getElementById(id);
        var arr = OUKA.t(key);
        ul.innerHTML = "";
        if (Array.isArray(arr)) arr.forEach(function (x) {
          var li = document.createElement("li"); li.textContent = x; ul.appendChild(li);
        });
      }
      function render() {
        fillPoints("jp-points", "pages.edu.jpPoints");
        fillPoints("voc-points", "pages.edu.vocPoints");
        fillPoints("life-points", "pages.edu.lifePoints");
      }
      render();
      document.addEventListener("ouka:langchange", render);
    })();
  </script>
